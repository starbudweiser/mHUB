name: Découverte des applis
on:
  schedule: [{cron: "17 5 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decouvrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/decouvrir.py
        env: {GH_TOKEN: "${{ github.token }}"}
      - run: |
          git diff --quiet Resources/catalogue.json && exit 0
          git config user.name "mHUB découverte"; git config user.email "actions@users.noreply.github.com"
          git commit -am "Catalogue : applis découvertes automatiquement"; git push
